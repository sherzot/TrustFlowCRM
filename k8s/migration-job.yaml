# ----------------------------------------------------------------------------
# TrustFlow CRM — Migration Job
#
# Runs `php artisan migrate --force` against the in-cluster MySQL.
#
# The image tag is patched by .github/workflows/deploy.yml at apply time:
#     sed "s#IMAGE_PLACEHOLDER#sherdev/trustflow-crm:sha-XXX#g" \
#         k8s/migration-job.yaml | kubectl apply -f -
#
# For a one-off manual run, replace IMAGE_PLACEHOLDER with :latest.
# ----------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: trustflow-migrate
  namespace: trustflow
  labels:
    app.kubernetes.io/name: trustflow-migrate
    app.kubernetes.io/part-of: trustflow-crm
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trustflow-migrate
        app.kubernetes.io/part-of: trustflow-crm
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Waiting for mysql.trustflow.svc.cluster.local:3306..."
              for i in $(seq 1 60); do
                if nc -z mysql.trustflow.svc.cluster.local 3306; then
                  echo "MySQL is reachable"
                  exit 0
                fi
                echo "retry $i/60"; sleep 2
              done
              echo "MySQL not reachable in time"; exit 1
      containers:
        - name: migrate
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "==> migrate --force"
              php artisan migrate --force
              echo "==> optimize:clear"
              php artisan optimize:clear || true
              echo "==> Done."
          envFrom:
            - configMapRef:
                name: trustflow-config
            - secretRef:
                name: trustflow-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
