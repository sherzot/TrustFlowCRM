# ----------------------------------------------------------------------------
# TrustFlow CRM — Redis Deployment + Service (Docker Desktop local K8s)
#
# Redis 7 alpine, in-memory only (no persistence — cache/session/queue reset
# on pod restart, which is fine for local dev). For prod use a StatefulSet
# with a PVC and appendonly yes.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: trustflow
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: trustflow-crm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: trustflow
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: trustflow-crm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: trustflow-crm
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --maxmemory-policy
            - allkeys-lru
            - --maxmemory
            - "256mb"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
