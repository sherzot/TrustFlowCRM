# ----------------------------------------------------------------------------
# TrustFlow CRM — app Deployment (Docker Desktop local Kubernetes)
#
# Image is pulled from Docker Hub: sherdev/trustflow-crm:latest
# The CI/CD pipeline (.github/workflows/deploy.yml) pins the image to a
# specific sha-XXX tag via `kubectl set image` after every successful build.
#
# For local cluster (docker-desktop) we run a single replica and drop the
# horizon / scheduler deployments — those are reserved for staging/prod.
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustflow-web
  namespace: trustflow
  labels:
    app.kubernetes.io/name: trustflow-web
    app.kubernetes.io/part-of: trustflow-crm
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: trustflow-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trustflow-web
        app.kubernetes.io/part-of: trustflow-crm
    spec:
      containers:
        - name: app
          image: sherdev/trustflow-crm:latest
          imagePullPolicy: Always
          env:
            - name: RUN_HORIZON
              value: "false"
            - name: RUN_SCHEDULER
              value: "false"
          envFrom:
            - configMapRef:
                name: trustflow-config
            - secretRef:
                name: trustflow-secrets
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "1500m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /up
              port: http
            failureThreshold: 60
            periodSeconds: 5
