apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustflow-web
  namespace: trustflow
  labels:
    app.kubernetes.io/name: trustflow-web
    app.kubernetes.io/part-of: trustflow-crm
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: trustflow-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trustflow-web
        app.kubernetes.io/part-of: trustflow-crm
    spec:
      securityContext:
        runAsUser: 33         # www-data
        runAsGroup: 33
        fsGroup: 33
      containers:
        - name: app
          image: ghcr.io/sherzot/trustflow-crm:latest
          imagePullPolicy: Always
          env:
            - name: RUN_HORIZON
              value: "false"
            - name: RUN_SCHEDULER
              value: "false"
          envFrom:
            - configMapRef:
                name: trustflow-config
            - secretRef:
                name: trustflow-secrets
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /up
              port: http
            failureThreshold: 30
            periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustflow-horizon
  namespace: trustflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trustflow-horizon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trustflow-horizon
        app.kubernetes.io/part-of: trustflow-crm
    spec:
      containers:
        - name: horizon
          image: ghcr.io/sherzot/trustflow-crm:latest
          command: ["php", "artisan", "horizon"]
          envFrom:
            - configMapRef:
                name: trustflow-config
            - secretRef:
                name: trustflow-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "768Mi"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustflow-scheduler
  namespace: trustflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trustflow-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trustflow-scheduler
        app.kubernetes.io/part-of: trustflow-crm
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/sherzot/trustflow-crm:latest
          command:
            - /bin/sh
            - -c
            - 'while true; do php artisan schedule:run --no-interaction; sleep 60; done'
          envFrom:
            - configMapRef:
                name: trustflow-config
            - secretRef:
                name: trustflow-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
