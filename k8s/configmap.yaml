apiVersion: v1
kind: ConfigMap
metadata:
  name: trustflow-config
  namespace: trustflow
data:
  APP_NAME: "TrustFlow CRM"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://crm.example.com"
  APP_TIMEZONE: "UTC"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"

  LOG_CHANNEL: "stack"
  LOG_STACK: "stderr"
  LOG_LEVEL: "info"

  DB_CONNECTION: "mysql"
  DB_HOST: "mysql.trustflow.svc.cluster.local"
  DB_PORT: "3306"
  DB_DATABASE: "trustflow_crm"

  REDIS_HOST: "redis.trustflow.svc.cluster.local"
  REDIS_PORT: "6379"

  SESSION_DRIVER: "redis"
  CACHE_STORE: "redis"
  QUEUE_CONNECTION: "redis"
  BROADCAST_CONNECTION: "reverb"

  OPENAI_MODEL: "gpt-4o-mini"
  OPENAI_TIMEOUT: "30"
  OPENAI_MAX_RETRIES: "3"
  AI_CACHE_TTL: "900"
