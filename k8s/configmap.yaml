# ----------------------------------------------------------------------------
# TrustFlow CRM — non-secret config (Docker Desktop local Kubernetes)
#
# For staging / production, override APP_URL, APP_ENV, APP_DEBUG, and log level
# via a kustomize overlay (see k8s/overlays/ — to be added later).
# ----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: trustflow-config
  namespace: trustflow
data:
  APP_NAME: "TrustFlow CRM"
  APP_ENV: "local"
  APP_DEBUG: "true"
  APP_URL: "http://localhost:30080"
  APP_TIMEZONE: "UTC"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"

  LOG_CHANNEL: "stack"
  LOG_STACK: "stderr"
  LOG_LEVEL: "debug"

  DB_CONNECTION: "mysql"
  DB_HOST: "mysql.trustflow.svc.cluster.local"
  DB_PORT: "3306"
  DB_DATABASE: "trustflow_crm"

  REDIS_HOST: "redis.trustflow.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_CLIENT: "phpredis"

  SESSION_DRIVER: "redis"
  CACHE_STORE: "redis"
  QUEUE_CONNECTION: "redis"
  BROADCAST_CONNECTION: "log"

  MAIL_MAILER: "log"

  OPENAI_MODEL: "gpt-4o-mini"
  OPENAI_TIMEOUT: "30"
  OPENAI_MAX_RETRIES: "3"
  AI_CACHE_TTL: "900"
