# ============================================================================
# TrustFlow CRM — CI/CD (v9, lightweight)
#
# Pipeline:
#     git push origin main
#         │
#         ▼
#     ┌───────────────────────────────────────────────────────────┐
#     │ JOB 1 — test     (ubuntu-latest, cloud)                   │
#     │   PHPUnit + MySQL 8 + Redis 7 — informational (see note)  │
#     └───────────────────────────────────────────────────────────┘
#         │ if green (or forced)
#         ▼
#     ┌───────────────────────────────────────────────────────────┐
#     │ JOB 2 — build    (ubuntu-latest, cloud)                   │
#     │   Docker build (linux/amd64) → push to GHCR               │
#     │   tags: :latest  :main  :sha-<short>                      │
#     └───────────────────────────────────────────────────────────┘
#
# Registry:  ghcr.io/sherzot/trustflowcrm
# Auth:      GITHUB_TOKEN (no secret setup needed — the workflow
#            declares `permissions: packages: write`)
#
# LOCAL DEVELOPMENT (unchanged):
#     docker compose up -d --build
#     open http://localhost:18080
#
# PRODUCTION DEPLOY (future — cloud VM / VPS / Railway / Fly):
#     git clone + cp .env.production.example .env.production
#     bash scripts/deploy.sh
#
# HISTORICAL NOTE:
# The earlier self-hosted macOS runner + Docker Desktop Kubernetes deploy
# job has been retired. Running K8s on Docker Desktop for a single-dev,
# local-target project cost more in CI flakiness than it returned in
# value. The k8s/ manifests and scripts/pf.sh are preserved in the tree
# for reference if/when a real K8s target (EKS / GKE / DOKS) appears,
# but they are no longer exercised by CI. See docs/deployment/overview.md.
# ============================================================================

name: CI/CD — Test + Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository }}   # sherzot/TrustFlowCRM — lowercased inside build job

jobs:
  # ==========================================================================
  # JOB 1 — Test (PHPUnit)
  # ==========================================================================
  test:
    name: Test (PHPUnit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: trustflow_test
          MYSQL_USER: trustflow
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, redis, bcmath, intl, zip, gd, exif, pcntl
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy .env.testing
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is ready"; exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"; sleep 2
          done
          echo "MySQL did not become ready"; exit 1

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: trustflow_test
          DB_USERNAME: trustflow
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: php artisan migrate --force

      # NOTE: test suite is still being stabilised. Until it is fully
      # reliable we keep PHPUnit green-informational — results show up in
      # the Actions log / job summary, but build is NOT gated on it.
      # Re-enable the gate by removing `continue-on-error: true` below
      # once the suite is trustworthy.
      - name: Run PHPUnit (informational)
        id: phpunit
        continue-on-error: true
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: trustflow_test
          DB_USERNAME: trustflow
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: |
          if [ -f artisan ]; then
            php artisan test --without-tty || php -d memory_limit=512M ./vendor/bin/phpunit
          fi

      - name: Record test outcome in summary
        if: always()
        run: |
          {
            echo "## Test job"
            if [ "${{ steps.phpunit.outcome }}" = "success" ]; then
              echo ":white_check_mark: PHPUnit passed."
            else
              echo ":warning: PHPUnit failed (non-blocking — see job log)."
              echo ""
              echo "Build was NOT blocked. Harden the suite to re-enable the gate."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # JOB 2 — Build & Push to GHCR
  # ==========================================================================
  build:
    name: Build & Push (GHCR)
    needs: test
    runs-on: ubuntu-latest
    # Only publish on main + workflow_dispatch — never on PRs from forks.
    if: github.event_name != 'pull_request'

    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha-short: ${{ steps.meta.outputs.sha-short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # GHCR requires lowercase image names; repo slugs may be mixed-case.
          IMAGE="${REGISTRY}/${IMAGE_REPO,,}"
          echo "sha-short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}"         >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only — every mainstream cloud target (AWS EC2/ECS,
      # Railway, Fly.io default, DigitalOcean, most VPS) runs amd64. Local
      # dev on Apple Silicon uses `docker compose up --build`, which
      # builds natively (arm64) without needing this image. If an arm64
      # cloud target appears, add `linux/arm64` to platforms — expect the
      # build to take 4-5x longer because of QEMU emulation.
      - name: Build & push (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha-short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            INSTALL_DEV=false

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build & Push"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Image  | \`${{ steps.meta.outputs.image }}\` |"
            echo "| Tags   | \`latest\`, \`main\`, \`sha-${{ steps.meta.outputs.sha-short }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "### Pull from any host"
            echo ""
            echo '```bash'
            echo "# if image is private, first:"
            echo "#   echo \$GHCR_TOKEN | docker login ghcr.io -u sherzot --password-stdin"
            echo "docker pull ${{ steps.meta.outputs.image }}:latest"
            echo '```'
            echo ""
            echo "### Deploy to a VPS / cloud VM"
            echo ""
            echo '```bash'
            echo "git clone https://github.com/sherzot/TrustFlowCRM.git && cd TrustFlowCRM"
            echo "cp .env.production.example .env.production   # then edit it"
            echo "bash scripts/deploy.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
