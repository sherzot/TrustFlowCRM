server {
    listen 8080 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 40m;

    # Hide version + prevent easy fingerprinting.
    server_tokens off;

    # Security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/xml application/vnd.api+json image/svg+xml;

    # Long-cache static assets produced by Vite.
    location ~* ^/build/.+\.(css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico|map)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Default Laravel routing.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP requests to FPM (local socket via 127.0.0.1:9000).
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
    }

    # FPM status endpoints - restricted to loopback.
    location ~ ^/(fpm-status|fpm-ping)$ {
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Deny hidden files.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
